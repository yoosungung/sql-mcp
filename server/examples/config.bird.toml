# BIRD Mini-Dev SQLite 타깃 예시.
# DSN: target_db/env.bird.example 을 source 한 뒤 기동.
listen = "127.0.0.1:8080"
max_rows = 1000
sample_limit = 20
timeout_ms = 30000

[[targets]]
id = "superhero"
name = "BIRD superhero"
engine = "sqlite"
url_env = "SQL_MCP_TARGET_SUPERHERO_URL"

