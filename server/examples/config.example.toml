# 예시 설정. DSN은 url_env 환경 변수로만 주입한다.
listen = "127.0.0.1:8080"
max_rows = 1000
sample_limit = 20
timeout_ms = 30000

[[targets]]
id = "dw"
name = "Data Warehouse"
engine = "postgres"
url_env = "SQL_MCP_TARGET_DW_URL"

# SQLite 예: engine = "sqlite", url_env → sqlite:/path/to.db?mode=ro
# MySQL 예:  engine = "mysql",  url_env → mysql://user:pass@host:3306/db
# Oracle 예: engine = "oracle", url_env → user/pass@host:1521/service  (oracledb connect string)
# BIRD Mini-Dev: config.bird.toml + ../target_db/README.md
# ADBC/JDBC/ODBC 비채택. Exadata는 engine=oracle.

