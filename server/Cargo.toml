[package]
name = "sql-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
jsonschema = { version = "0.58", default-features = false, features = ["resolve-file"] }
libsql = { version = "0.9", default-features = false, features = ["core"] }
rmcp = { version = "3.5", features = [
  "server",
  "macros",
  "transport-streamable-http-server",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = "0.58"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "json",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
