apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sql-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sql-mcp
    spec:
      containers:
        - name: sql-mcp
          image: sql-mcp:local
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SQL_MCP_LISTEN
              value: 0.0.0.0:8080
            - name: SQL_MCP_SEMANTIC_PATH
              value: /data/semantic.db
            - name: SQL_MCP_CONFIG
              value: /config/config.toml
            - name: SQL_MCP_TARGET_DW_URL
              valueFrom:
                secretKeyRef:
                  name: sql-mcp-targets
                  key: dw_url
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: sql-mcp-config
        - name: data
          emptyDir: {}
